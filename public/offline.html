<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Wordelia</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 2rem;
            text-align: center;
            background: #FFFAEF;
            color: #234A4E;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .badge {
            width: 72px; height: 72px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 9999px;
            background: rgba(51, 104, 113, 0.1);
            color: #336871;
        }
        h1 { font-size: 1.35rem; margin: 0; color: #336871; }
        p { margin: 0; max-width: 22rem; color: #234A4E; opacity: .8; line-height: 1.5; font-size: .95rem; }
        button {
            margin-top: .5rem;
            border: none;
            background: #336871;
            color: #fff;
            font-weight: 600;
            font-size: .95rem;
            padding: .8rem 1.6rem;
            border-radius: 9999px;
            cursor: pointer;
        }
        button:active { opacity: .85; }
    </style>
</head>
<body>
    <div class="badge" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No hemos podido cargar esta página. Revisa tu conexión y vuelve a intentarlo; tu lectura te espera.</p>
    <button onclick="location.reload()">Reintentar</button>
</body>
</html>
